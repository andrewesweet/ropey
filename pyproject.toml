[project]
name = "ropey"
version = "0.2.0"
description = "MCP server exposing rope's Python refactoring catalogue to coding agents. ty finds and reads; ropey changes."
readme = "README.md"
authors = [
    { name = "Andrew Sweet", email = "andrew.sweet@cantab.net" }
]
requires-python = ">=3.10"
dependencies = [
    "rope>=1.13",
    "mcp>=1.2",
    "pathspec>=0.12",
]

[project.scripts]
ropey = "ropey.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
